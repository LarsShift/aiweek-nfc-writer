<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>aiweek-nfc-writer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>NFC Writer</h1>
    <p class="label">Target URL</p>
    <p id="target" class="target">—</p>

    <div id="indicator" class="indicator" aria-hidden="true">
      <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>
      </svg>
    </div>
    <p id="hint" class="hint">Hold the top back of your phone against the NFC tag.</p>

    <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>
    <button id="start" type="button"><span class="spinner"></span><span id="btnText">Start Writing</span></button>
  </main>
  <script src="app.js"></script>
</body>
</html>
